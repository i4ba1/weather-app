name: Verify weather app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore WeatherApp.slnx
      - run: dotnet build WeatherApp.slnx -c Release --no-restore
      - run: dotnet test WeatherApp.slnx -c Release --no-build --no-restore
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run lint && npm run test -- --run && npm run build && npm run test:e2e
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker build -t xtramile-weather:ci .
